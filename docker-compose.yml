services:
  trainer:
    build: .
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./mlartifacts:/app/mlartifacts
      - ./mlflow.db:/app/mlflow.db
    command: ["python", "src/02_train_mlflow.py"]

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlartifacts:/app/mlartifacts
      - ./mlflow.db:/app/mlflow.db
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db